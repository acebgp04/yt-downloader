<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Forgot password - YouTube Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <a href="{{ url_for('index') }}" class="brand"><span class="brand-mark"></span>YouTube Downloader</a>
    </div>
  </div>

  <div class="page page-narrow" style="padding-top: 96px;">
    <div class="card">
      <h1>Forgot password</h1>
      <p class="subtitle">We'll email you a link to reset it.</p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
        {% endif %}
      {% endwith %}
      <form method="POST" class="stack">
        <input type="email" name="email" placeholder="Email" required>
        <button type="submit" class="btn-full">Send reset link</button>
      </form>
      <div class="links-row">
        <a href="{{ url_for('auth.login') }}">Back to log in</a>
      </div>
    </div>
  </div>
</body>
</html>
