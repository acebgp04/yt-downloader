<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Log in - YouTube Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_version }}">
</head>
<body>
  <div class="page page-narrow" style="padding-top: 96px;">
    <div class="card">
      <h1>Log in</h1>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
        {% endif %}
      {% endwith %}
      <a href="{{ url_for('auth.google_login') }}" class="btn btn-google btn-full">Sign in with Google</a>
      <div class="divider">or</div>
      <form method="POST" class="stack">
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn-full">Log in</button>
      </form>
      <div class="links-row">
        <a href="{{ url_for('auth.signup') }}">Sign up</a>
        <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
        <a href="{{ url_for('index') }}">Back to downloader</a>
      </div>
    </div>
  </div>
</body>
</html>
